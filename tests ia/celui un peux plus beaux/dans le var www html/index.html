<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loup-Garou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">

  <div class="bg-overlay"></div>
  <div class="moon"></div>
  <div class="stars" id="stars"></div>

  <main class="home-container">

    <div class="logo-wrap">
      <div class="logo-icon">🐺</div>
      <h1 class="logo-title">Loup-Garou</h1>
      <p class="logo-sub">Le jeu des villageois et des monstres</p>
    </div>

    <div class="home-card">

      <div class="form-group">
        <label>Ton pseudo</label>
        <input id="pseudo" type="text" placeholder="Entre ton nom..." maxlength="20" autocomplete="off">
      </div>

      <div class="divider"><span>Nouvelle partie</span></div>

      <button class="btn btn-primary" onclick="createRoom()">
        <span class="btn-icon">🏠</span> Créer une partie
      </button>

      <div class="divider"><span>ou rejoindre</span></div>

      <div class="form-group">
        <label>Code de la room</label>
        <input id="roomCode" type="text" placeholder="XXXX" maxlength="4" autocomplete="off">
      </div>

      <button class="btn btn-secondary" onclick="joinRoom()">
        <span class="btn-icon">🚪</span> Rejoindre
      </button>

      <div id="error-msg" class="error-msg"></div>

    </div>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/socket.js"></script>

  <script>
    // Générer les étoiles
    const starsContainer = document.getElementById("stars");
    for (let i = 0; i < 120; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDelay = Math.random() * 3 + "s";
      star.style.width = star.style.height = (Math.random() * 2.5 + 0.5) + "px";
      starsContainer.appendChild(star);
    }
  </script>

</body>
</html>
