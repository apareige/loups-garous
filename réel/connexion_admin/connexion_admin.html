<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maître du Jeu  Accès Restreint</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="grain"></div>

  <div class="container">
    <p class="label-top">ACCES INTERDIT !</p>
    <h1>Rentrer le code Admin</h1>

    <div class="pin-display" id="pinDisplay">
      <div class="pin-dot" id="d0"><span></span></div>
      <div class="pin-dot" id="d1"><span></span></div>
      <div class="pin-dot" id="d2"><span></span></div>
      <div class="pin-dot" id="d3"><span></span></div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="keypad" id="keypad">
      <button type="button" class="key" data-val="1">1</button>
      <button type="button" class="key" data-val="2">2</button>
      <button type="button" class="key" data-val="3">3</button>
      <button type="button" class="key" data-val="4">4</button>
      <button type="button" class="key" data-val="5">5</button>
      <button type="button" class="key" data-val="6">6</button>
      <button type="button" class="key" data-val="7">7</button>
      <button type="button" class="key" data-val="8">8</button>
      <button type="button" class="key" data-val="9">9</button>
    </div>

    <div class="keypad-last">
      <div class="key-spacer"></div>
      <button type="button" class="key" data-val="0">0</button>
      <button  type="button" class="key key-suppr" id="btnSuppr">Suppr</button>
    </div>

    <a class="back-link" id="backLink">Retourner à l'accueil</a>
  </div>
  <script src="http://192.168.1.20:3000/socket.io/socket.io.js"></script>
  <script src="assets/js/connexion_ad_script.js"></script>

</body>
</html>
